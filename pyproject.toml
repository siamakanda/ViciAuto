[project]
name = "viciauto"
version = "0.1.0"
description = "Menu-driven bulk automation for ViciDial call-center servers"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "tqdm>=4.66.0",
]

[project.scripts]
viciauto = "viciauto:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["learning_resources"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
